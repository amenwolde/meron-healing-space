backend:
  name: git-gateway
  branch: main

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

site_url: https://www.meronhealingspace.com
display_url: https://www.meronhealingspace.com

publish_mode: simple

collections:

  # ---------------- TREATMENTS ----------------
  - name: "treatments"
    label: "Treatments"
    label_singular: "Treatment"
    folder: "src/treatments"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { name: title, label: "Treatment name", widget: string }
      - { name: order, label: "Display order (1 shows first)", widget: number, value_type: int, default: 1 }
      - { name: eyebrow, label: "Small label above the title", widget: string, default: "Holistic Treatment" }
      - { name: summary, label: "Short description (shown on cards)", widget: text }
      - { name: image, label: "Photo", widget: image, required: false, hint: "Optional. Shown on the treatment card and page." }
      - { name: price, label: "Price", widget: string, default: "Pricing on enquiry", hint: "e.g. 'From £90' or 'Pricing on enquiry'" }
      - { name: format, label: "Format", widget: string, default: "In person", hint: "e.g. 'In person' or 'In person or online'" }
      - { name: body, label: "Full description", widget: text, hint: "Leave a blank line between paragraphs." }
      - name: highlights
        label: "Key points (shown on the treatment card)"
        widget: list
        required: false
        field: { name: item, label: "Point", widget: string }
      - name: suitableFor
        label: "This may suit you if…"
        widget: list
        required: false
        field: { name: item, label: "Reason", widget: string }
      - name: includes
        label: "What is included"
        widget: list
        required: false
        field: { name: item, label: "Item", widget: string }
      - name: glance
        label: "At a glance panel"
        widget: list
        required: false
        fields:
          - { name: key, label: "Label", widget: string }
          - { name: value, label: "Value", widget: string }
      - { name: noteTitle, label: "Highlight box title", widget: string, required: false }
      - { name: noteText, label: "Highlight box text", widget: text, required: false }
      - { name: compareBestFor, label: "Comparison table — best for", widget: string, required: false }
      - { name: compareIncludes, label: "Comparison table — includes", widget: string, required: false }
      - { name: metaDescription, label: "Google search description", widget: text, required: false }

  # ---------------- NEWS ----------------
  - name: "news"
    label: "News & Updates"
    label_singular: "Update"
    folder: "src/news"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: summary, label: "Short summary (shown on cards)", widget: text }
      - { name: image, label: "Photo", widget: image, required: false }
      - { name: body, label: "Full text", widget: text, hint: "Leave a blank line between paragraphs." }

  # ---------------- PAGES ----------------
  - name: "pages"
    label: "Pages"
    files:

      - name: "home"
        label: "1. Home Page"
        file: "src/_data/pages/home.json"
        fields:
          - { name: metaTitle, label: "Browser tab title", widget: string }
          - { name: metaDescription, label: "Google search description", widget: text }
          - { name: heroEyebrow, label: "Top — small label", widget: string }
          - { name: heroTitleA, label: "Top — title line 1 (highlighted)", widget: string }
          - { name: heroTitleB, label: "Top — title line 2", widget: string }
          - { name: heroText, label: "Top — text", widget: text }
          - { name: heroPrimaryLabel, label: "Top — main button", widget: string }
          - { name: heroSecondaryLabel, label: "Top — second button", widget: string }
          - { name: heroImage, label: "Top — photo", widget: image, required: false, hint: "Optional. Replaces the decorative panel." }
          - { name: heroQuote, label: "Top panel — quote (if no photo)", widget: string, required: false }
          - { name: heroTag, label: "Top panel — small line (if no photo)", widget: string, required: false }
          - { name: marquee, label: "Scrolling strip words", widget: string, hint: "Separate each word with a comma." }
          - { name: welcomeEyebrow, label: "Welcome — small label", widget: string }
          - { name: welcomeHeadingA, label: "Welcome — heading line 1", widget: string }
          - { name: welcomeHeadingB, label: "Welcome — heading line 2 (highlighted)", widget: string }
          - { name: welcomeBody, label: "Welcome — text", widget: text, hint: "Leave a blank line between paragraphs." }
          - { name: welcomeImage, label: "Welcome — photo", widget: image, required: false }
          - { name: welcomeImageQuote, label: "Welcome panel quote (if no photo)", widget: string, required: false }
          - { name: welcomeBadgeNum, label: "Badge — big text", widget: string, required: false }
          - { name: welcomeBadgeLabel, label: "Badge — small text", widget: string, required: false }
          - { name: treatmentsEyebrow, label: "Treatments — small label", widget: string }
          - { name: treatmentsHeadingA, label: "Treatments — heading line 1", widget: string }
          - { name: treatmentsHeadingB, label: "Treatments — heading line 2 (highlighted)", widget: string }
          - { name: treatmentsIntro, label: "Treatments — intro text", widget: text }
          - { name: supportEyebrow, label: "What ETM helps with — small label", widget: string }
          - { name: supportHeadingA, label: "What ETM helps with — heading line 1", widget: string }
          - { name: supportHeadingB, label: "What ETM helps with — heading line 2 (highlighted)", widget: string }
          - { name: supportIntro, label: "What ETM helps with — intro text", widget: text }

      - name: "about"
        label: "2. About Page"
        file: "src/_data/pages/about.json"
        fields:
          - { name: metaTitle, label: "Browser tab title", widget: string }
          - { name: metaDescription, label: "Google search description", widget: text }
          - { name: heroEyebrow, label: "Top — small label", widget: string }
          - { name: heroTitleA, label: "Top — title line 1", widget: string }
          - { name: heroTitleB, label: "Top — title line 2 (highlighted)", widget: string }
          - { name: heroText, label: "Top — text", widget: text }
          - { name: storyEyebrow, label: "Our Story — small label", widget: string }
          - { name: storyHeadingA, label: "Our Story — heading line 1", widget: string }
          - { name: storyHeadingB, label: "Our Story — heading line 2 (highlighted)", widget: string }
          - { name: storyBody, label: "Our Story — text", widget: text, hint: "Leave a blank line between paragraphs." }
          - { name: storyPull, label: "Our Story — highlighted quote", widget: text }
          - { name: storyImage, label: "Our Story — photo of Meron", widget: image, required: false }
          - { name: storyImageQuote, label: "Story panel quote (if no photo)", widget: string, required: false }
          - { name: whatEyebrow, label: "What is ETM — small label", widget: string }
          - { name: whatHeadingA, label: "What is ETM — heading line 1", widget: string }
          - { name: whatHeadingB, label: "What is ETM — heading line 2 (highlighted)", widget: string }
          - { name: whatBody, label: "What is ETM — text", widget: text }
          - { name: whatPull, label: "What is ETM — highlighted quote", widget: string }
          - name: elements
            label: "The elements of ETM"
            widget: list
            fields:
              - { name: label, label: "Number label", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Description", widget: text }
          - { name: expEyebrow, label: "The Experience — small label", widget: string }
          - { name: expHeadingA, label: "The Experience — heading line 1", widget: string }
          - { name: expHeadingB, label: "The Experience — heading line 2 (highlighted)", widget: string }
          - { name: expBody, label: "The Experience — text", widget: text }
          - name: steps
            label: "The four steps of a session"
            widget: list
            fields:
              - { name: num, label: "Number", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Description", widget: text }
          - { name: practicalEyebrow, label: "Before You Come — small label", widget: string }
          - { name: practicalHeadingA, label: "Before You Come — heading line 1", widget: string }
          - { name: practicalHeadingB, label: "Before You Come — heading line 2 (highlighted)", widget: string }
          - name: practicalItems
            label: "Before You Come — list"
            widget: list
            field: { name: item, label: "Item", widget: string }
          - { name: practicalImage, label: "Before You Come — photo", widget: image, required: false }
          - { name: practicalImageQuote, label: "Panel quote (if no photo)", widget: string, required: false }

      - name: "treatmentsPage"
        label: "3. Treatments Page"
        file: "src/_data/pages/treatments.json"
        fields:
          - { name: metaTitle, label: "Browser tab title", widget: string }
          - { name: metaDescription, label: "Google search description", widget: text }
          - { name: heroEyebrow, label: "Top — small label", widget: string }
          - { name: heroTitleA, label: "Top — title line 1", widget: string }
          - { name: heroTitleB, label: "Top — title line 2 (highlighted)", widget: string }
          - { name: heroText, label: "Top — text", widget: text }
          - { name: helpTitle, label: "Help card — title", widget: string }
          - { name: helpText, label: "Help card — text", widget: text }
          - { name: compareEyebrow, label: "Comparison — small label", widget: string }
          - { name: compareHeadingA, label: "Comparison — heading line 1", widget: string }
          - { name: compareHeadingB, label: "Comparison — heading line 2 (highlighted)", widget: string }
          - { name: supportEyebrow, label: "How ETM helps — small label", widget: string }
          - { name: supportHeadingA, label: "How ETM helps — heading line 1", widget: string }
          - { name: supportHeadingB, label: "How ETM helps — heading line 2 (highlighted)", widget: string }
          - { name: supportIntro, label: "How ETM helps — intro text", widget: text }
          - name: items
            label: "What ETM can help with"
            widget: list
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Description", widget: text }
          - { name: note, label: "Medical disclaimer", widget: text }

      - name: "book"
        label: "4. Book Page (incl. contact & FAQs)"
        file: "src/_data/pages/book.json"
        fields:
          - { name: metaTitle, label: "Browser tab title", widget: string }
          - { name: metaDescription, label: "Google search description", widget: text }
          - { name: heroEyebrow, label: "Top — small label", widget: string }
          - { name: heroTitleA, label: "Top — title line 1", widget: string }
          - { name: heroTitleB, label: "Top — title line 2 (highlighted)", widget: string }
          - { name: heroText, label: "Top — text", widget: text }
          - name: options
            label: "Booking options"
            widget: list
            fields:
              - { name: id, label: "Link anchor (no spaces)", widget: string }
              - { name: style, label: "Colour", widget: select, options: ["clay", "plain", "bark", "sage"] }
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Description", widget: text }
              - { name: label, label: "Button text", widget: string }
          - { name: howEyebrow, label: "How it works — small label", widget: string }
          - { name: howHeadingA, label: "How it works — heading line 1", widget: string }
          - { name: howHeadingB, label: "How it works — heading line 2 (highlighted)", widget: string }
          - name: steps
            label: "Booking steps"
            widget: list
            fields:
              - { name: num, label: "Number", widget: string }
              - { name: title, label: "Title", widget: string }
              - { name: text, label: "Description", widget: text }
          - { name: formEyebrow, label: "Form — small label", widget: string }
          - { name: formHeadingA, label: "Form — heading line 1", widget: string }
          - { name: formHeadingB, label: "Form — heading line 2 (highlighted)", widget: string }
          - { name: formIntro, label: "Form — intro text", widget: text }
          - { name: cancellation, label: "Cancellation note", widget: text }
          - { name: faqEyebrow, label: "FAQs — small label", widget: string }
          - { name: faqHeadingA, label: "FAQs — heading line 1", widget: string }
          - { name: faqHeadingB, label: "FAQs — heading line 2 (highlighted)", widget: string }
          - name: faqs
            label: "Questions & answers"
            widget: list
            fields:
              - { name: q, label: "Question", widget: string }
              - { name: a, label: "Answer", widget: text }

      - name: "newsPage"
        label: "5. News Page"
        file: "src/_data/pages/news.json"
        fields:
          - { name: metaTitle, label: "Browser tab title", widget: string }
          - { name: metaDescription, label: "Google search description", widget: text }
          - { name: heroEyebrow, label: "Top — small label", widget: string }
          - { name: heroTitleA, label: "Top — title line 1", widget: string }
          - { name: heroTitleB, label: "Top — title line 2 (highlighted)", widget: string }
          - { name: heroText, label: "Top — text", widget: text }
          - { name: emptyMessage, label: "Message when there are no posts", widget: string }

  # ---------------- SITE SETTINGS ----------------
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "general"
        label: "General & Contact Details"
        file: "src/_data/site.json"
        fields:
          - { name: title, label: "Site name", widget: string }
          - { name: brandPrefix, label: "Logo — first part (highlighted)", widget: string }
          - { name: brandName, label: "Logo — rest of name", widget: string }
          - { name: announce, label: "Top announcement bar", widget: string }
          - { name: email, label: "Email address", widget: string }
          - { name: instagram, label: "Instagram handle", widget: string }
          - { name: instagramUrl, label: "Instagram link", widget: string }
          - { name: location, label: "Location", widget: text }
          - { name: hours, label: "Opening hours", widget: string }
          - { name: responseTime, label: "Response time", widget: string }
          - { name: footerBlurb, label: "Footer description", widget: text }
          - { name: disclaimer, label: "Footer disclaimer", widget: text }
          - { name: copyright, label: "Copyright line", widget: string }

      - name: "cta"
        label: "Bottom Call-to-Action (all pages)"
        file: "src/_data/cta.json"
        fields:
          - { name: eyebrow, label: "Small label", widget: string }
          - { name: headingA, label: "Heading line 1", widget: string }
          - { name: headingB, label: "Heading line 2 (highlighted)", widget: string }
          - { name: body, label: "Text", widget: text }
          - { name: primaryLabel, label: "Button text", widget: string }
          - { name: primaryUrl, label: "Button link", widget: string }
          - { name: secondaryLabel, label: "(unused)", widget: string, required: false }
          - { name: secondaryUrl, label: "(unused)", widget: string, required: false }
          - { name: closing, label: "Closing line", widget: string }
